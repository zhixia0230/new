[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiomap-rr-core"
version = "0.1.0"
description = "Actual rollout-state and self-conditioning-history supervision for RadioMap flow matching"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "Pillow", "scipy", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["radiomap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
